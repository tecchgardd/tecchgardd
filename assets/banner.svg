<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b1a"/>
      <stop offset="100%" stop-color="#121232"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,20px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-15px); } }
      .fadein { opacity: 0; animation: fade 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 1s; } .d4 { animation-delay: 1.4s; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .typing { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(34) 1.6s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="60" r="220" fill="url(#glow1)"/>
    <circle class="float2" cx="160" cy="300" r="200" fill="url(#glow2)"/>
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>

    <!-- Left: identity -->
    <g class="fadein d1">
      <text x="70" y="92" class="mono" font-size="16" fill="#a78bfa">// hello, world</text>
    </g>
    <g class="fadein d2">
      <text x="68" y="150" class="sans" font-size="54" font-weight="800" fill="#f5f5ff">Gabriel Aluir</text>
    </g>
    <g class="fadein d3">
      <text x="70" y="192" class="sans" font-size="24" font-weight="600" fill="url(#accent)">Full Stack Developer</text>
      <text x="70" y="226" class="sans" font-size="17" fill="#9ca3c7">Web · Mobile · Automation</text>
    </g>
    <g class="fadein d4">
      <rect x="70" y="252" width="246" height="32" rx="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-opacity="0.5"/>
      <circle class="pulse" cx="90" cy="268" r="5" fill="#22c55e"/>
      <text x="104" y="273" class="sans" font-size="14" fill="#d8d4ff">Open to international roles</text>
    </g>

    <!-- Right: terminal -->
    <g transform="translate(640,56)"><g class="fadein d2">
      <rect width="490" height="210" rx="12" fill="#0d0d1f" stroke="#2e2e5a"/>
      <rect width="490" height="34" rx="12" fill="#16163a"/>
      <rect y="22" width="490" height="12" fill="#16163a"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
      <circle cx="40" cy="17" r="6" fill="#febc2e"/>
      <circle cx="60" cy="17" r="6" fill="#28c840"/>
      <text x="245" y="22" text-anchor="middle" class="mono" font-size="12" fill="#6b6b9a">gabriel@gardsoft: ~</text>

      <text x="20" y="66" class="mono" font-size="14"><tspan fill="#22c55e">➜</tspan><tspan fill="#60a5fa"> ~ </tspan><tspan fill="#e5e7ff">cat stack.json</tspan></text>
      <text x="20" y="92" class="mono" font-size="14" fill="#e5e7ff">{</text>
      <text x="40" y="114" class="mono" font-size="14"><tspan fill="#a78bfa">"front"</tspan><tspan fill="#e5e7ff">: </tspan><tspan fill="#fbbf24">["React","Next.js","RN"]</tspan><tspan fill="#e5e7ff">,</tspan></text>
      <text x="40" y="136" class="mono" font-size="14"><tspan fill="#a78bfa">"back"</tspan><tspan fill="#e5e7ff">:  </tspan><tspan fill="#fbbf24">["Node","Python","TS"]</tspan><tspan fill="#e5e7ff">,</tspan></text>
      <text x="40" y="158" class="mono" font-size="14"><tspan fill="#a78bfa">"data"</tspan><tspan fill="#e5e7ff">:  </tspan><tspan fill="#fbbf24">["Postgres","MySQL","n8n"]</tspan></text>
      <text x="20" y="180" class="mono" font-size="14" fill="#e5e7ff">}</text>
      <g class="typing">
        <text x="20" y="200" class="mono" font-size="14"><tspan fill="#22c55e">➜</tspan><tspan fill="#60a5fa"> ~ </tspan><tspan fill="#e5e7ff">npm run build-something-great</tspan></text>
      </g>
      <rect class="cursor" x="304" y="189" width="9" height="15" fill="#a78bfa"/>
    </g></g>
  </g>
</svg>
